<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Racha dos Irmãos - Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        
        /* UI Overlay */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; p-4; }
        .interactive { pointer-events: auto; }
        
        /* Neon Glows */
        .neon-text { text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5); }
        .p1-color { color: #ef4444; text-shadow: 0 0 10px #ef4444; }
        .p2-color { color: #3b82f6; text-shadow: 0 0 10px #3b82f6; }
        
        /* Controls for Mobile */
        .touch-zone { position: absolute; bottom: 20px; width: 40%; height: 150px; background: rgba(255,255,255,0.1); border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; display: flex; align-items: center; justify-content: center; }
        .touch-zone:active { background: rgba(255,255,255,0.3); }
        #left-zone { left: 20px; }
        #right-zone { right: 20px; }
    </style>
</head>
<body>

    <!-- TELA DE LOBBY -->
    <div id="lobby" class="fixed inset-0 bg-gray-900 z-50 flex flex-col items-center justify-center p-4">
        <h1 class="text-4xl md:text-6xl text-white font-black mb-2 tracking-tighter italic neon-text">RACHA<span class="text-yellow-500">.io</span></h1>
        <p class="text-gray-400 mb-8">Disputa em Tempo Real</p>
        
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 w-full max-w-sm shadow-2xl relative">
            <div id="connection-status" class="absolute top-2 right-2 w-3 h-3 rounded-full bg-red-500"></div>
            
            <label class="block text-gray-400 text-sm mb-1">Seu Piloto</label>
            <input type="text" id="username" placeholder="Nome..." class="w-full bg-gray-900 text-white p-3 rounded border border-gray-600 mb-4 focus:border-yellow-500 outline-none uppercase font-bold">
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="joinGame(1)" class="bg-red-600 hover:bg-red-500 text-white p-4 rounded font-bold transition transform hover:scale-105">
                    <div class="text-xs opacity-75">CRIAR SALA</div>
                    PLAYER 1
                </button>
                <button onclick="joinGame(2)" class="bg-blue-600 hover:bg-blue-500 text-white p-4 rounded font-bold transition transform hover:scale-105">
                    <div class="text-xs opacity-75">ENTRAR NA SALA</div>
                    PLAYER 2
                </button>
            </div>
            <p class="mt-4 text-xs text-center text-gray-500">Player 1 cria a sala. Player 2 entra nela.</p>
        </div>
    </div>

    <!-- HUD DO JOGO -->
    <div id="game-ui" class="ui-layer hidden">
        <div class="flex justify-between p-4 w-full">
            <div class="bg-gray-900 bg-opacity-80 p-2 rounded border border-red-500 text-center min-w-[100px]">
                <div class="text-xs text-gray-400">P1 (Vermelho)</div>
                <div id="p1-laps" class="text-2xl font-bold text-white">0/10</div>
            </div>
            
            <div class="text-center">
                <div id="race-status" class="text-yellow-500 font-bold text-xl neon-text animate-pulse">AQUECENDO MOTORES...</div>
            </div>

            <div class="bg-gray-900 bg-opacity-80 p-2 rounded border border-blue-500 text-center min-w-[100px]">
                <div class="text-xs text-gray-400">P2 (Azul)</div>
                <div id="p2-laps" class="text-2xl font-bold text-white">0/10</div>
            </div>
        </div>

        <!-- Controles Mobile (Só aparecem se for touch) -->
        <div id="mobile-controls" class="hidden w-full h-full pointer-events-none">
            <div id="left-zone" class="touch-zone"><span class="text-4xl text-white opacity-50">◄</span></div>
            <div id="right-zone" class="touch-zone"><span class="text-4xl text-white opacity-50">►</span></div>
        </div>
    </div>

    <!-- O JOGO -->
    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE CONFIG (EDITAR AQUI) ---
        // Se estiveres a testar neste editor, ele usará a config automática (__firebase_config).
        // Se fores colocar no teu próprio site, substitui os valores abaixo pelos do teu projeto Firebase.
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBfVOCuakSWtU6O_d_XstGoDpAg8fC2_n4",
            authDomain: "jogo-de-2-169d9.firebaseapp.com",
            projectId: "jogo-de-2-169d9",
            storageBucket: "jogo-de-2-169d9.firebasestorage.app",
            messagingSenderId: "37135467278",
            appId: "1:37135467278:web:e2e0cdec4c6dbcda768d5f"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Use um ID padrão se não estiver no ambiente de teste
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-race-game';

        // --- VARIÁVEIS DO JOGO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let myPlayerId = 0; // 1 ou 2
        let gameActive = false;
        let userId = null;

        // Configurações da Pista e Carros
        const trackRadius = 300; // Tamanho da pista
        const carSize = { w: 20, h: 36 };
        
        // Estado Local dos Carros
        const cars = {
            1: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, lastLapAngle: 0, color: '#ef4444', targetX: 0, targetY: 0, targetAngle: 0 },
            2: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, lastLapAngle: 0, color: '#3b82f6', targetX: 0, targetY: 0, targetAngle: 0 }
        };

        // Inputs
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let isMobile = false;

        // --- SISTEMA DE AUTENTICAÇÃO E INICIALIZAÇÃO ---
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userId = user.uid;
                document.getElementById('connection-status').classList.replace('bg-red-500', 'bg-green-500');
            }
        });

        // --- FUNÇÕES DE LOBBY ---
        window.joinGame = async (playerNum) => {
            const name = document.getElementById('username').value.trim() || `Piloto ${playerNum}`;
            if (!userId) return alert("Conectando ao servidor... aguarde.");

            myPlayerId = playerNum;
            
            // UI Switch
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            
            // Mobile check
            if ('ontouchstart' in window) {
                isMobile = true;
                document.getElementById('mobile-controls').classList.remove('hidden');
            }

            // Inicializar Posições
            resetPositions();

            // Começar Sync
            startGameLoop();
            setupFirestoreListener();
            
            // Registrar entrada
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'race_room_1');
            // Se for P1, reseta o jogo no banco. Se for P2, só entra.
            if (myPlayerId === 1) {
                await setDoc(docRef, {
                    status: 'WAITING',
                    p1: { name, active: true, x: cars[1].x, y: cars[1].y, angle: cars[1].angle, laps: 0 },
                    // Não apagamos p2 se ele já estiver lá, mas idealmente resetariamos
                    lastUpdate: Date.now()
                }, { merge: true });
            } else {
                 await setDoc(docRef, {
                    p2: { name, active: true, x: cars[2].x, y: cars[2].y, angle: cars[2].angle, laps: 0 },
                    status: 'RACING' // P2 entrando começa a corrida
                }, { merge: true });
            }
        };

        function resetPositions() {
            // Posicionar carros na linha de largada
            cars[1].x = canvas.width / 2 - 20;
            cars[1].y = canvas.height / 2 + trackRadius - 40; // Parte de baixo do círculo
            cars[1].angle = 0; // Apontando para direita (0 radianos)
            cars[1].laps = -1; // Começa com -1 para contar a primeira passagem na linha como "0" voltas completas
            
            cars[2].x = canvas.width / 2 + 20;
            cars[2].y = canvas.height / 2 + trackRadius - 40;
            cars[2].angle = 0;
            cars[2].laps = -1;
            
            // Sync targets
            cars[1].targetX = cars[1].x; cars[1].targetY = cars[1].y;
            cars[2].targetX = cars[2].x; cars[2].targetY = cars[2].y;
        }

        // --- LÓGICA DO JOGO (CLIENTE) ---
        
        // Inputs
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        
        // Touch Controls
        const leftZone = document.getElementById('left-zone');
        const rightZone = document.getElementById('right-zone');
        
        leftZone.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowLeft = true; keys.ArrowUp = true; }); // Auto-gas on mobile
        leftZone.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowLeft = false; keys.ArrowUp = false; });
        rightZone.addEventListener('touchstart', (e) => { e.preventDefault(); keys.ArrowRight = true; keys.ArrowUp = true; });
        rightZone.addEventListener('touchend', (e) => { e.preventDefault(); keys.ArrowRight = false; keys.ArrowUp = false; });

        function updatePhysics(carId) {
            const car = cars[carId];
            
            // Aceleração / Rotação (Apenas para o meu carro)
            if (carId === myPlayerId) {
                if (keys.ArrowUp) car.speed += 0.2;
                if (keys.ArrowDown) car.speed -= 0.1;
                if (keys.ArrowLeft) car.angle -= 0.07; // Curva mais fechada
                if (keys.ArrowRight) car.angle += 0.07;
                
                // Atrito
                car.speed *= 0.96;
                
                // Mover
                car.x += Math.cos(car.angle) * car.speed;
                car.y += Math.sin(car.angle) * car.speed;

                // Colisão com Limites (Simplificada - Distância do centro)
                const dx = car.x - canvas.width / 2;
                const dy = car.y - canvas.height / 2;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                // Se sair da pista (muito longe ou muito perto do centro), desacelera muito
                if (dist > trackRadius + 60 || dist < trackRadius - 60) {
                    car.speed *= 0.8; // Grama/Areia
                }
            } else {
                // Interpolação para o oponente (Suavizar movimento recebido do banco)
                const lerp = 0.1; // Fator de suavização
                car.x += (car.targetX - car.x) * lerp;
                car.y += (car.targetY - car.y) * lerp;
                
                // Interpolação angular mais inteligente (evitar girar 360 desnecessário)
                let dAngle = car.targetAngle - car.angle;
                while (dAngle > Math.PI) dAngle -= Math.PI * 2;
                while (dAngle < -Math.PI) dAngle += Math.PI * 2;
                car.angle += dAngle * lerp;
            }

            // Contagem de Voltas (Lógica de Arco)
            // Calculamos o ângulo em relação ao centro da pista
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            let currentArcAngle = Math.atan2(car.y - cy, car.x - cx);
            
            // Detectar cruzar a linha de chegada (ângulo positivo para negativo perto de PI/2)
            // Linha de chegada está em baixo (90 graus ou PI/2)
            // Simplificação: Se passou pelo ponto Y baixo e X mudou de sinal, ou apenas contagem angular
            // Vamos usar checkpoints simples: Se angulo cruza PI/2 (90deg)
            
            // Maneira robusta: Se cruzou a linha de largada (em baixo, x > centro)
            if (carId === myPlayerId) {
                // Checar se cruzou a linha de meta (ângulo PI/2)
                 // Vamos simplificar: se passamos da direita pra esquerda na parte de baixo
                if (car.lastLapAngle < 1.5 && currentArcAngle >= 1.5 && car.y > cy) {
                   // Passou perto da linha de baixo?
                }
                
                // Método simples de checkpoint: dividir pista em 4 quadrantes
                // Q1 -> Q2 -> Q3 -> Q4 -> Q1 (Volta)
                // Isso requer estado extra.
                
                // Método "Avanço de Angulo":
                let diff = currentArcAngle - car.lastLapAngle;
                // Tratar a virada de -PI para +PI
                if (diff < -Math.PI) diff += Math.PI * 2;
                if (diff > Math.PI) diff -= Math.PI * 2;
                
                // Se diff for positivo, está indo sentido horário (vamos definir sentido horário como correto)
                if (diff > 0) {
                    car.progress += diff;
                }
                car.lastLapAngle = currentArcAngle;
            }
        }

        // --- RENDERIZAÇÃO ---
        function drawTrack() {
            // Fundo
            ctx.fillStyle = '#2d3748'; // Asfalto escuro
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // Grama fora
            ctx.beginPath();
            ctx.fillStyle = '#064e3b';
            ctx.rect(0,0,canvas.width, canvas.height);
            ctx.arc(cx, cy, trackRadius + 50, 0, Math.PI * 2, true); // Buraco
            ctx.fill();

            // Grama dentro
            ctx.beginPath();
            ctx.arc(cx, cy, trackRadius - 50, 0, Math.PI * 2);
            ctx.fill();
            
            // Zebras / Limites
            ctx.beginPath();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.arc(cx, cy, trackRadius + 50, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(cx, cy, trackRadius - 50, 0, Math.PI * 2);
            ctx.stroke();

            // Linha de Chegada (Em baixo)
            ctx.beginPath();
            ctx.strokeStyle = '#fbbf24'; // Amarelo
            ctx.lineWidth = 8;
            ctx.moveTo(cx, cy + trackRadius - 50);
            ctx.lineTo(cx, cy + trackRadius + 50);
            ctx.stroke();
            
            // Padrão Xadrez na chegada
            for(let i=0; i<10; i++) {
                ctx.fillStyle = i%2===0 ? '#fff' : '#000';
                ctx.fillRect(cx - 4 + (i%2)*4, cy + trackRadius - 50 + i*10, 4, 10);
            }
        }

        function drawCar(id) {
            const car = cars[id];
            ctx.save();
            ctx.translate(car.x, car.y);
            ctx.rotate(car.angle);
            
            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-carSize.w/2 + 5, -carSize.h/2 + 5, carSize.w, carSize.h);

            // Corpo do Carro
            ctx.fillStyle = car.color;
            // Efeito neon se for o oponente
            if (id !== myPlayerId) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = car.color;
            }
            
            // Desenhar carro (Retangulo arredondado simples)
            ctx.beginPath();
            ctx.roundRect(-carSize.w/2, -carSize.h/2, carSize.w, carSize.h, 3);
            ctx.fill();

            // Janela
            ctx.fillStyle = '#111';
            ctx.fillRect(-carSize.w/2 + 2, -carSize.h/4, carSize.w - 4, carSize.h/3);
            
            // Faróis
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(carSize.w/2 - 2, -carSize.h/2, 2, 4); // Direita frente (considerando rotação 0 = direita)
            ctx.fillRect(carSize.w/2 - 2, carSize.h/2 - 4, 2, 4); 

            // Nome
            ctx.restore();
            
            // Desenhar nome acima do carro (sem rotação)
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(id === myPlayerId ? "VOCÊ" : `P${id}`, car.x, car.y - 25);
        }

        function gameLoop() {
            // Resize canvas
            if (canvas.width !== window.innerWidth) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            // Updates
            updatePhysics(1);
            updatePhysics(2);

            // Checar linha de chegada (sistema simplificado de coordenadas)
            // Se Y é maior que centro, e X passa de negativo para positivo (sentido anti-horário padrão aqui é direita -> baixo -> esquerda -> cima)
            // Vamos usar o Firestore para contar voltas baseado na "autoridade" do cliente
            checkLaps(myPlayerId);

            // Draw
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();
            drawCar(1);
            drawCar(2);

            requestAnimationFrame(gameLoop);
        }

        function checkLaps(pid) {
            const car = cars[pid];
            const cx = canvas.width/2;
            const cy = canvas.height/2;
            
            // Checkpoint simples: Cruzar o eixo Y positivo (em baixo) da esquerda para direita
            // Mas o angulo 0 é direita.
            // Vamos simplificar: Distancia angular acumulada seria o ideal, mas complexo para demo.
            // Vamos usar: Se passou pelo X=Centro na parte de baixo da tela
            
            // Se estava na esquerda e foi pra direita, na parte de baixo
            // Precisamos guardar o X anterior
            if (!car.lastX) car.lastX = car.x;
            
            // Linha de chegada no bottom (Y > cy)
            if (car.y > cy + (trackRadius - 60)) {
                if (car.lastX < cx && car.x >= cx) {
                    // Completou volta (Sentido Anti-horário)
                    car.laps++;
                    updateLapCount(pid);
                }
            }
            car.lastX = car.x;
        }
        
        async function updateLapCount(pid) {
            document.getElementById(pid === 1 ? 'p1-laps' : 'p2-laps').innerText = `${Math.max(0, cars[pid].laps)}/10`;
            
            // Se completou 10, Fim de Jogo
            if (cars[pid].laps >= 10) {
                // Enviar status de vitória
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'race_room_1');
                await updateDoc(docRef, {
                    winner: pid,
                    status: 'FINISHED'
                });
            }
        }

        function startGameLoop() {
            if (gameActive) return;
            gameActive = true;
            resetPositions();
            requestAnimationFrame(gameLoop);
            
            // Iniciar envio de dados (Sync Loop)
            // Limitamos a 10 updates por segundo para economizar banda e evitar bloqueio
            setInterval(sendPosition, 100); 
        }

        // --- NETWORKING (FIRESTORE) ---
        
        async function sendPosition() {
            if (!userId || !myPlayerId) return;
            
            const car = cars[myPlayerId];
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'race_room_1');
            
            const field = myPlayerId === 1 ? 'p1' : 'p2';
            
            try {
                // Atualizamos apenas campos essenciais
                await updateDoc(docRef, {
                    [`${field}.x`]: Math.round(car.x), // Arredondar economiza bytes e reduz noise
                    [`${field}.y`]: Math.round(car.y),
                    [`${field}.angle`]: parseFloat(car.angle.toFixed(3)),
                    [`${field}.laps`]: car.laps
                });
            } catch (e) {
                // Ignorar erros de network temporários
            }
        }

        function setupFirestoreListener() {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'race_room_1');
            
            onSnapshot(docRef, (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();

                // Atualizar Estado do Jogo
                if (data.status === 'RACING') {
                    document.getElementById('race-status').innerText = "CORRIDA EM ANDAMENTO!";
                    document.getElementById('race-status').classList.remove('animate-pulse');
                    document.getElementById('race-status').classList.add('text-green-500');
                }
                
                if (data.status === 'FINISHED') {
                    const winnerName = data.winner === 1 ? "VERMELHO" : "AZUL";
                    document.getElementById('race-status').innerText = `VENCEDOR: ${winnerName}!`;
                    document.getElementById('race-status').className = "text-4xl font-black text-white neon-text animate-bounce";
                }

                // Atualizar Oponente
                const opponentId = myPlayerId === 1 ? 2 : 1;
                const opponentData = opponentId === 1 ? data.p1 : data.p2;
                
                if (opponentData) {
                    // Definir o alvo para onde o carro do oponente deve ir (interpolação cuida do resto)
                    cars[opponentId].targetX = opponentData.x;
                    cars[opponentId].targetY = opponentData.y;
                    cars[opponentId].targetAngle = opponentData.angle;
                    
                    // Atualizar UI de voltas do oponente
                    const displayLaps = opponentData.laps < 0 ? 0 : opponentData.laps;
                    document.getElementById(opponentId === 1 ? 'p1-laps' : 'p2-laps').innerText = `${displayLaps}/10`;
                }
            });
        }
    </script>
</body>
</html>
