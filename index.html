<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RACHA V3 - FINAL FIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; touch-action: none; font-family: 'Verdana', sans-serif; user-select: none; }
        canvas { display: block; margin: auto; }
        
        /* Efeitos Visuais */
        .neon-text { text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5); }
        .crash-flash { animation: flash-red 0.5s ease-in-out; }
        
        @keyframes flash-red {
            0%, 100% { background-color: #0f172a; }
            50% { background-color: #ef4444; }
        }

        /* Botões */
        .btn-start { background: linear-gradient(to bottom, #ef4444, #b91c1c); box-shadow: 0 4px 0 #7f1d1d; }
        .btn-start:active { transform: translateY(4px); box-shadow: 0 0 0 #7f1d1d; }
        .btn-join { background: linear-gradient(to bottom, #3b82f6, #1d4ed8); box-shadow: 0 4px 0 #1e3a8a; }
        .btn-join:active { transform: translateY(4px); box-shadow: 0 0 0 #1e3a8a; }
        
        .btn-force { background: #eab308; color: black; font-weight: 900; border: 2px solid #fff; padding: 10px 20px; border-radius: 50px; box-shadow: 0 0 15px #eab308; animation: pulse 1s infinite; pointer-events: auto; }

        /* Controles Mobile */
        .touch-area {
            position: absolute; bottom: 20px; width: 40%; height: 160px; 
            border-radius: 20px; border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
        }
        .touch-area:active { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
        #btn-left { left: 20px; }
        #btn-right { right: 20px; }
        .arrow { font-size: 50px; color: rgba(255,255,255,0.4); }

        /* UI Overlay */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body id="body">

    <!-- ÁUDIOS -->
    <audio id="bgm" loop>
        <source src="https://od.lk/s/OTFfMjk5NjY2MzRf/phonk_drift_energy.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-lap">
        <source src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-crash">
        <source src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- LOBBY -->
    <div id="lobby" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-4 text-white interactive">
        <h1 class="text-5xl font-black italic tracking-tighter mb-2 text-yellow-400 neon-text">RACHA V3</h1>
        <p class="text-slate-400 mb-8 text-center text-sm">Correção de Conexão + Botão de Forçar</p>
        
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-sm border border-slate-700 shadow-xl relative">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-red-500 absolute top-6 right-6 animate-pulse" title="Status Conexão"></div>
            
            <label class="text-xs text-slate-400 uppercase font-bold ml-1">Seu Piloto</label>
            <input type="text" id="username" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 mb-6 text-white font-bold outline-none focus:border-yellow-500 uppercase" placeholder="APELIDO...">

            <div class="flex flex-col gap-3">
                <button onclick="startGame(1)" class="btn-start text-white font-black py-4 rounded-xl text-xl w-full interactive">
                    CRIAR SALA (P1)
                </button>
                <button onclick="startGame(2)" class="btn-join text-white font-black py-4 rounded-xl text-xl w-full interactive">
                    ENTRAR (P2)
                </button>
            </div>
            
            <div class="mt-4 flex items-center justify-center gap-2">
                <input type="checkbox" id="music-toggle" checked class="w-4 h-4">
                <label for="music-toggle" class="text-xs text-slate-400">Ativar Música</label>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-ui" class="ui-layer hidden">
        <div class="flex justify-between w-full max-w-2xl mx-auto pt-2 relative">
            <div class="bg-slate-900/90 border-l-4 border-red-500 p-2 rounded w-24 text-center shadow-lg">
                <div class="text-[10px] text-red-400 font-bold">P1</div>
                <div id="p1-laps" class="text-2xl font-black text-white">0</div>
            </div>

            <div class="flex flex-col items-center pt-2">
                <div id="game-msg" class="text-yellow-400 font-bold text-lg drop-shadow-md animate-pulse">AGUARDANDO...</div>
                
                <!-- BOTÃO DE EMERGÊNCIA (Aparece só para P1 se travar) -->
                <button id="force-start-btn" onclick="forceStart()" class="btn-force hidden mt-4">
                    FORÇAR INÍCIO ⚡
                </button>
            </div>

            <div class="bg-slate-900/90 border-r-4 border-blue-500 p-2 rounded w-24 text-center shadow-lg">
                <div class="text-[10px] text-blue-400 font-bold">P2</div>
                <div id="p2-laps" class="text-2xl font-black text-white">0</div>
            </div>
        </div>

        <!-- Controles Touch -->
        <div id="mobile-controls" class="hidden w-full h-full pointer-events-none">
            <div id="btn-left" class="touch-area"><span class="arrow">◄</span></div>
            <div id="btn-right" class="touch-area"><span class="arrow">►</span></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURAÇÃO ---
        const firebaseConfig = {
            apiKey: "AIzaSyBfVOCuakSWtU6O_d_XstGoDpAg8fC2_n4",
            authDomain: "jogo-de-2-169d9.firebaseapp.com",
            projectId: "jogo-de-2-169d9",
            storageBucket: "jogo-de-2-169d9.firebasestorage.app",
            messagingSenderId: "37135467278",
            appId: "1:37135467278:web:e2e0cdec4c6dbcda768d5f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ÁUDIO ---
        const bgm = document.getElementById('bgm');
        const sfxLap = document.getElementById('sfx-lap');
        const sfxCrash = document.getElementById('sfx-crash');
        bgm.volume = 0.4;

        // --- VARIÁVEIS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const body = document.getElementById('body');
        
        const VIRTUAL_WIDTH = 800;
        const VIRTUAL_HEIGHT = 800;
        const TRACK_RADIUS = 320;
        const TRACK_WIDTH = 100;
        const SAFE_INNER = TRACK_RADIUS - (TRACK_WIDTH/2) - 10;
        const SAFE_OUTER = TRACK_RADIUS + (TRACK_WIDTH/2) + 10;
        
        let myId = 0; 
        let isReady = false;
        let scaleFactor = 1;
        let lastCrashTime = 0;

        // Física
        const MAX_SPEED = 7.5;
        const ACCEL = 0.25;
        const TURN_SPEED = 0.09;
        const FRICTION = 0.96;

        const state = {
            p1: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, name: 'P1' },
            p2: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, name: 'P2' },
            status: 'WAITING',
            winner: null,
            lastCrash: 0
        };

        const keys = { left: false, right: false, up: false };

        // --- RESIZE ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const scaleX = window.innerWidth / VIRTUAL_WIDTH;
            const scaleY = window.innerHeight / VIRTUAL_HEIGHT;
            scaleFactor = Math.min(scaleX, scaleY) * 0.95;
        }
        window.addEventListener('resize', resize);
        // Chama resize algumas vezes para garantir que mobile carregou UI
        setTimeout(resize, 100);
        setTimeout(resize, 500);

        // --- AUTH ---
        signInAnonymously(auth).catch(console.error);
        onAuthStateChanged(auth, (user) => {
            if (user) document.getElementById('status-dot').classList.replace('bg-red-500', 'bg-green-500');
        });

        // --- START ---
        window.startGame = async (id) => {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) return alert("DIGITE UM NOME!");

            if (document.getElementById('music-toggle').checked) {
                bgm.play().catch(e => console.log("Toque na tela para música"));
            }
            
            myId = id;
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');

            // Mostrar botão de forçar para o P1 depois de 3 segundos se ainda estiver esperando
            if (myId === 1) {
                setTimeout(() => {
                    const msg = document.getElementById('game-msg').innerText;
                    if (msg.includes("AGUARDANDO")) {
                        document.getElementById('force-start-btn').classList.remove('hidden');
                    }
                }, 3000);
            }

            if('ontouchstart' in window) {
                document.getElementById('mobile-controls').classList.remove('hidden');
            }

            resetMyPosition();

            const docRef = doc(db, 'corridas', 'sala_unica');
            const myData = { ...state[`p${myId}`], name: nameInput, active: true }; // Adicionamos 'active'

            // P1 Reinicia a sala
            if (myId === 1) {
                await setDoc(docRef, { 
                    p1: myData, 
                    // NÃO zeramos o P2 aqui para evitar kickar ele se ele já conectou
                    status: 'WAITING', 
                    winner: null,
                    lastCrash: 0
                }, { merge: true });
            } else {
                // P2 apenas entra e diz que está ativo
                await setDoc(docRef, { 
                    p2: myData,
                    // P2 NÃO muda o status sozinho, deixa P1 decidir
                }, { merge: true });
                
                document.getElementById('game-msg').innerText = "CONECTANDO...";
            }

            isReady = true;
            setupListener();
            requestAnimationFrame(loop);
            setInterval(sendData, 50);
        };

        // Função para o P1 forçar o início
        window.forceStart = async () => {
             const docRef = doc(db, 'corridas', 'sala_unica');
             await updateDoc(docRef, { status: 'RACING' });
             document.getElementById('force-start-btn').classList.add('hidden');
        };

        function resetMyPosition() {
            const startY = VIRTUAL_HEIGHT/2 + TRACK_RADIUS - 40;
            const p = state[`p${myId}`];
            p.x = (myId === 1) ? VIRTUAL_WIDTH/2 - 30 : VIRTUAL_WIDTH/2 + 30;
            p.y = startY;
            p.angle = 0; 
            p.speed = 0;
        }

        // --- INPUTS ---
        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') keys.left = true;
            if(e.key === 'ArrowRight') keys.right = true;
            if(e.key === 'ArrowUp') keys.up = true;
        });
        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowLeft') keys.left = false;
            if(e.key === 'ArrowRight') keys.right = false;
            if(e.key === 'ArrowUp') keys.up = false;
        });

        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const handleTouch = (dir, active) => {
            if(dir === 'left') keys.left = active;
            if(dir === 'right') keys.right = active;
            keys.up = (keys.left || keys.right); 
        };
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch('left', true); });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); handleTouch('left', false); });
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch('right', true); });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); handleTouch('right', false); });

        // --- LÓGICA ---
        function updatePhysics() {
            const p = state[`p${myId}`];
            
            if (keys.up) p.speed += ACCEL;
            p.speed *= FRICTION;
            if (p.speed > MAX_SPEED) p.speed = MAX_SPEED;
            
            if (Math.abs(p.speed) > 0.1) {
                if (keys.left) p.angle -= TURN_SPEED;
                if (keys.right) p.angle += TURN_SPEED;
            }

            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;

            // Crash Check
            const dx = p.x - VIRTUAL_WIDTH/2;
            const dy = p.y - VIRTUAL_HEIGHT/2;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (state.status === 'RACING' && (dist < SAFE_INNER || dist > SAFE_OUTER)) {
                triggerGlobalReset();
                return;
            }

            checkLaps(p);
        }

        async function triggerGlobalReset() {
            if (Date.now() - lastCrashTime < 2000) return;
            lastCrashTime = Date.now();
            
            resetMyPosition();
            const docRef = doc(db, 'corridas', 'sala_unica');
            await updateDoc(docRef, {
                status: 'CRASHED',
                lastCrash: Date.now(), 
                'p1.laps': 0,
                'p2.laps': 0
            });
        }

        function checkLaps(player) {
            const cx = VIRTUAL_WIDTH/2;
            const cy = VIRTUAL_HEIGHT/2;
            if (player.y > cy + 200) { 
                 const wasLeft = (player.x - Math.cos(player.angle)*player.speed) < cx;
                 const isRight = player.x >= cx;
                 if (wasLeft && isRight) {
                     player.laps++;
                     sfxLap.currentTime = 0;
                     sfxLap.play(); 
                     updateMyScore();
                 }
            }
        }

        async function updateMyScore() {
            const el = document.getElementById(`p${myId}-laps`);
            const laps = Math.max(0, state[`p${myId}`].laps);
            el.innerText = laps;
            if (laps >= 10 && state.status !== 'FINISHED') {
                await updateDoc(doc(db, 'corridas', 'sala_unica'), {
                    status: 'FINISHED',
                    winner: myId
                });
            }
        }

        // --- DESENHO (Compatibilidade Mobile Fixa) ---
        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            const offsetX = (canvas.width - VIRTUAL_WIDTH * scaleFactor) / 2;
            const offsetY = (canvas.height - VIRTUAL_HEIGHT * scaleFactor) / 2;
            ctx.translate(offsetX, offsetY);
            ctx.scale(scaleFactor, scaleFactor);

            const cx = VIRTUAL_WIDTH/2;
            const cy = VIRTUAL_HEIGHT/2;

            // Pista (Desenhada em ordem)
            // 1. Fundo Perigo (Vermelho)
            ctx.beginPath();
            ctx.arc(cx, cy, SAFE_OUTER, 0, Math.PI*2);
            ctx.fillStyle = '#b91c1c';
            ctx.fill();

            // 2. Grama Externa
            ctx.beginPath();
            ctx.arc(cx, cy, TRACK_RADIUS + 50, 0, Math.PI*2);
            ctx.fillStyle = '#334155';
            ctx.fill();

            // 3. Asfalto Principal
            ctx.beginPath();
            ctx.arc(cx, cy, TRACK_RADIUS + 45, 0, Math.PI*2);
            ctx.arc(cx, cy, TRACK_RADIUS - 45, 0, Math.PI*2, true);
            ctx.fillStyle = '#475569';
            ctx.fill();

            // 4. Buraco Central (Perigo)
            ctx.beginPath();
            ctx.arc(cx, cy, SAFE_INNER, 0, Math.PI*2);
            ctx.fillStyle = '#b91c1c';
            ctx.fill();
            
            // 5. Centro Seguro
            ctx.beginPath();
            ctx.arc(cx, cy, SAFE_INNER - 10, 0, Math.PI*2);
            ctx.fillStyle = '#0f172a'; 
            ctx.fill();

            // Linha Chegada
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#fbbf24'; 
            ctx.beginPath();
            ctx.moveTo(cx, cy + TRACK_RADIUS - 50);
            ctx.lineTo(cx, cy + TRACK_RADIUS + 50);
            ctx.stroke();

            drawCar(state.p1, '#ef4444'); 
            drawCar(state.p2, '#3b82f6'); 

            ctx.restore();
        }

        function drawCar(player, color) {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-12, -8, 24, 16);
            
            // Corpo (USANDO FUNÇÃO SEGURA)
            ctx.fillStyle = color;
            drawRoundedRect(ctx, -10, -18, 20, 36, 4);

            // Luz de Freio
            if (player.speed < 0.5) {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-8, 18, 16, 2);
            }

            // Farol
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(6, -18, 4, 3);
            ctx.fillRect(-10, -18, 4, 3);

            ctx.restore();
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(player.name || '', player.x, player.y - 30);
        }

        function loop() {
            if (!isReady) return;
            try {
                updatePhysics();
                draw();
            } catch (e) {
                console.error("Erro no loop:", e);
            }
            requestAnimationFrame(loop);
        }

        // --- REDE (SYNC) ---
        async function sendData() {
            if (!isReady) return;

            const myPlayer = state[`p${myId}`];
            const docRef = doc(db, 'corridas', 'sala_unica');
            const payload = {};
            payload[`p${myId}`] = {
                x: Math.round(myPlayer.x),
                y: Math.round(myPlayer.y),
                angle: parseFloat(myPlayer.angle.toFixed(2)),
                laps: myPlayer.laps,
                name: myPlayer.name,
                active: true
            };
            try { await updateDoc(docRef, payload); } catch (e) {}
        }

        function setupListener() {
            onSnapshot(doc(db, 'corridas', 'sala_unica'), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                // CRASH LOGIC
                if (data.status === 'CRASHED' && data.lastCrash !== state.lastCrash) {
                    state.lastCrash = data.lastCrash;
                    body.classList.add('crash-flash');
                    sfxCrash.play();
                    setTimeout(() => body.classList.remove('crash-flash'), 500);
                    state.p1.laps = 0;
                    state.p2.laps = 0;
                    resetMyPosition();
                    
                    const msg = document.getElementById('game-msg');
                    msg.innerText = "CRASH! RESET!";
                    msg.className = "text-red-500 font-black text-2xl animate-ping";
                    
                    if (myId === 1) {
                        setTimeout(() => {
                            updateDoc(doc(db, 'corridas', 'sala_unica'), { status: 'RACING' });
                        }, 2000);
                    }
                }

                if (data.status !== 'CRASHED') {
                    state.status = data.status || 'WAITING';
                    const statusEl = document.getElementById('game-msg');
                    
                    // Lógica para P1 Auto-Start
                    // Se eu sou P1, e estamos esperando, mas o P2 já está ativo -> COMEÇA!
                    if (myId === 1 && state.status === 'WAITING' && data.p2 && data.p2.active) {
                        updateDoc(doc(db, 'corridas', 'sala_unica'), { status: 'RACING' });
                    }

                    if (state.status === 'RACING') {
                        statusEl.innerText = "ACELERA!";
                        statusEl.className = "text-green-500 font-bold text-lg";
                        // Esconde botão de forçar se o jogo começou
                        document.getElementById('force-start-btn').classList.add('hidden');
                    } else if (state.status === 'FINISHED') {
                        const w = data.winner === 1 ? 'VERMELHO' : 'AZUL';
                        statusEl.innerText = `${w} VENCEU!`;
                        statusEl.className = "text-white font-black text-2xl neon-text animate-bounce";
                    } else {
                        statusEl.innerText = "AGUARDANDO O P2...";
                        statusEl.className = "text-yellow-400 font-bold text-lg drop-shadow-md animate-pulse";
                    }
                }

                // Sync Oponente
                const enemyId = myId === 1 ? 2 : 1;
                const enemyKey = `p${enemyId}`;
                const enemyData = data[enemyKey];
                if (enemyData) {
                    state[enemyKey].x = enemyData.x;
                    state[enemyKey].y = enemyData.y;
                    state[enemyKey].angle = enemyData.angle;
                    state[enemyKey].name = enemyData.name;
                    state[enemyKey].laps = enemyData.laps;
                    document.getElementById(`${enemyKey}-laps`).innerText = enemyData.laps;
                }
                
                document.getElementById(`p${myId}-laps`).innerText = state[`p${myId}`].laps;
            });
        }
    </script>
</body>
</html>
