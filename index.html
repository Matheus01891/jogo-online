<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RACHA V4 - SEM BLOQUEIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; touch-action: none; font-family: 'Verdana', sans-serif; user-select: none; }
        canvas { display: block; margin: auto; }
        
        /* Efeitos Visuais */
        .crash-flash { animation: flash-red 0.5s ease-in-out; }
        @keyframes flash-red { 0%, 100% { background-color: #0f172a; } 50% { background-color: #ef4444; } }

        /* Botões */
        .btn-start { background: #ef4444; color: white; font-weight: 900; padding: 15px; border-radius: 12px; border: 2px solid #fff; width: 100%; margin-bottom: 10px; box-shadow: 0 4px 0 #991b1b; }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }
        
        .btn-join { background: #3b82f6; color: white; font-weight: 900; padding: 15px; border-radius: 12px; border: 2px solid #fff; width: 100%; box-shadow: 0 4px 0 #1e40af; }
        .btn-join:active { transform: translateY(4px); box-shadow: none; }

        /* Botão Reiniciar (Pequeno no topo) */
        .btn-reset { 
            background: #eab308; color: black; font-weight: bold; font-size: 10px;
            padding: 4px 8px; border-radius: 4px; border: 1px solid white;
            pointer-events: auto; text-transform: uppercase;
        }

        /* Controles Mobile */
        .touch-area {
            position: absolute; bottom: 20px; width: 40%; height: 160px; 
            border-radius: 20px; border: 2px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
        }
        .touch-area:active { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }
        #btn-left { left: 20px; }
        #btn-right { right: 20px; }
        .arrow { font-size: 50px; color: rgba(255,255,255,0.4); }

        /* UI Overlay */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body id="body">

    <!-- ÁUDIOS -->
    <audio id="bgm" loop>
        <source src="https://od.lk/s/OTFfMjk5NjY2MzRf/phonk_drift_energy.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-lap">
        <source src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-crash">
        <source src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- LOBBY SIMPLIFICADO -->
    <div id="lobby" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-white interactive">
        <h1 class="text-4xl font-black italic mb-2 text-yellow-400">RACHA V4</h1>
        <p class="text-slate-400 mb-6 text-center text-xs">SEM ESPERA - ENTROU, JOGOU</p>
        
        <div class="w-full max-w-xs">
            <input type="text" id="username" class="w-full bg-slate-800 border border-slate-600 rounded p-3 mb-4 text-white font-bold uppercase text-center" placeholder="SEU NOME">
            
            <button onclick="startGame(1)" class="btn-start">SOU O PLAYER 1 (VERMELHO)</button>
            <button onclick="startGame(2)" class="btn-join">SOU O PLAYER 2 (AZUL)</button>
            
            <div class="mt-4 flex items-center justify-center gap-2">
                <input type="checkbox" id="music-toggle" checked class="w-4 h-4">
                <label for="music-toggle" class="text-xs text-slate-400">Música Ligada</label>
            </div>
        </div>
    </div>

    <!-- HUD DO JOGO -->
    <div id="game-ui" class="ui-layer hidden">
        <!-- Placar Topo -->
        <div class="flex justify-between items-start w-full max-w-2xl mx-auto">
            <!-- P1 Score -->
            <div class="bg-slate-900/90 border-l-4 border-red-500 p-2 rounded w-20 text-center">
                <div class="text-[10px] text-red-400 font-bold">P1</div>
                <div id="p1-laps" class="text-xl font-black text-white">0</div>
            </div>

            <!-- Status Central e Botão Reset -->
            <div class="flex flex-col items-center gap-2">
                <div id="game-msg" class="text-green-500 font-bold text-sm bg-black/50 px-3 py-1 rounded-full">JOGO ATIVO</div>
                <button onclick="forceReset()" class="btn-reset interactive">REINICIAR TUDO ↻</button>
            </div>

            <!-- P2 Score -->
            <div class="bg-slate-900/90 border-r-4 border-blue-500 p-2 rounded w-20 text-center">
                <div class="text-[10px] text-blue-400 font-bold">P2</div>
                <div id="p2-laps" class="text-xl font-black text-white">0</div>
            </div>
        </div>

        <!-- Controles Touch -->
        <div id="mobile-controls" class="hidden w-full h-full pointer-events-none">
            <div id="btn-left" class="touch-area"><span class="arrow">◄</span></div>
            <div id="btn-right" class="touch-area"><span class="arrow">►</span></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURAÇÃO ---
        const firebaseConfig = {
            apiKey: "AIzaSyBfVOCuakSWtU6O_d_XstGoDpAg8fC2_n4",
            authDomain: "jogo-de-2-169d9.firebaseapp.com",
            projectId: "jogo-de-2-169d9",
            storageBucket: "jogo-de-2-169d9.firebasestorage.app",
            messagingSenderId: "37135467278",
            appId: "1:37135467278:web:e2e0cdec4c6dbcda768d5f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ÁUDIO ---
        const bgm = document.getElementById('bgm');
        const sfxLap = document.getElementById('sfx-lap');
        const sfxCrash = document.getElementById('sfx-crash');
        bgm.volume = 0.4;

        // --- VARIÁVEIS DO JOGO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const body = document.getElementById('body');
        
        // Pista
        const VIRTUAL_WIDTH = 800;
        const VIRTUAL_HEIGHT = 800;
        const TRACK_RADIUS = 320;
        const TRACK_WIDTH = 100;
        const SAFE_INNER = TRACK_RADIUS - (TRACK_WIDTH/2) - 15; // Margem extra de segurança
        const SAFE_OUTER = TRACK_RADIUS + (TRACK_WIDTH/2) + 15;
        
        let myId = 0; 
        let isReady = false;
        let scaleFactor = 1;
        let lastCrashTime = 0;

        // Física (Ajustada para ser mais controlável)
        const MAX_SPEED = 7.0;
        const ACCEL = 0.3;
        const TURN_SPEED = 0.08;
        const FRICTION = 0.95;

        // Estado Local
        const state = {
            p1: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, name: 'P1' },
            p2: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, name: 'P2' },
            status: 'RACING', // Sempre RACING, nunca WAITING
            lastCrash: 0
        };

        const keys = { left: false, right: false, up: false };

        // --- AUTH SIMPLES ---
        signInAnonymously(auth).catch(console.error);

        // --- RESIZE ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const scaleX = window.innerWidth / VIRTUAL_WIDTH;
            const scaleY = window.innerHeight / VIRTUAL_HEIGHT;
            scaleFactor = Math.min(scaleX, scaleY) * 0.95;
        }
        window.addEventListener('resize', resize);
        
        // --- INICIAR JOGO (SEM ESPERA) ---
        window.startGame = async (id) => {
            const nameInput = document.getElementById('username').value.trim() || `PLAYER ${id}`;
            
            // Música
            if (document.getElementById('music-toggle').checked) {
                bgm.play().catch(e => console.log("Toque para música"));
            }

            myId = id;
            
            // UI
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            if('ontouchstart' in window) {
                document.getElementById('mobile-controls').classList.remove('hidden');
            }

            // Garante o resize
            resize();

            // Posição Inicial
            resetMyPosition();
            state[`p${myId}`].name = nameInput;

            // Inicia Loops IMEDIATAMENTE (Não espera rede)
            isReady = true;
            requestAnimationFrame(loop);
            setInterval(sendData, 50); // Sync rede
            setupListener(); // Ouve rede

            // Atualiza Banco (Sem travar)
            const docRef = doc(db, 'corridas', 'sala_unica');
            const myData = { 
                x: state[`p${myId}`].x, 
                y: state[`p${myId}`].y, 
                angle: 0, 
                laps: 0,
                name: nameInput 
            };
            
            // Apenas atualiza meus dados, não mexe no status global para não travar o outro
            try {
                const updatePayload = {};
                updatePayload[`p${myId}`] = myData;
                await setDoc(docRef, updatePayload, { merge: true });
            } catch(e) { console.log("Erro inicial rede", e); }
        };

        // --- BOTÃO DE REINICIAR TUDO ---
        window.forceReset = async () => {
            const docRef = doc(db, 'corridas', 'sala_unica');
            await updateDoc(docRef, {
                status: 'CRASHED',
                lastCrash: Date.now(),
                'p1.laps': 0,
                'p2.laps': 0
            });
        };

        function resetMyPosition() {
            const startY = VIRTUAL_HEIGHT/2 + TRACK_RADIUS - 40;
            const p = state[`p${myId}`];
            // P1 Esquerda, P2 Direita
            p.x = (myId === 1) ? VIRTUAL_WIDTH/2 - 30 : VIRTUAL_WIDTH/2 + 30;
            p.y = startY;
            p.angle = 0; 
            p.speed = 0;
        }

        // --- CONTROLES ---
        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') keys.left = true;
            if(e.key === 'ArrowRight') keys.right = true;
            if(e.key === 'ArrowUp') keys.up = true;
        });
        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowLeft') keys.left = false;
            if(e.key === 'ArrowRight') keys.right = false;
            if(e.key === 'ArrowUp') keys.up = false;
        });

        const handleTouch = (dir, active) => {
            if(dir === 'left') keys.left = active;
            if(dir === 'right') keys.right = active;
            keys.up = (keys.left || keys.right); 
        };
        document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch('left', true); });
        document.getElementById('btn-left').addEventListener('touchend', (e) => { e.preventDefault(); handleTouch('left', false); });
        document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch('right', true); });
        document.getElementById('btn-right').addEventListener('touchend', (e) => { e.preventDefault(); handleTouch('right', false); });

        // --- LÓGICA DO JOGO ---
        function updatePhysics() {
            const p = state[`p${myId}`];
            
            // Movimento
            if (keys.up) p.speed += ACCEL;
            p.speed *= FRICTION;
            if (p.speed > MAX_SPEED) p.speed = MAX_SPEED;
            
            if (Math.abs(p.speed) > 0.1) {
                if (keys.left) p.angle -= TURN_SPEED;
                if (keys.right) p.angle += TURN_SPEED;
            }

            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;

            // Verificar se saiu da pista (Crash)
            const dx = p.x - VIRTUAL_WIDTH/2;
            const dy = p.y - VIRTUAL_HEIGHT/2;
            const dist = Math.sqrt(dx*dx + dy*dy);

            // Se bater na grama
            if (dist < SAFE_INNER || dist > SAFE_OUTER) {
                triggerLocalCrash(); // Apenas reseta a mim mesmo localmente primeiro
                triggerGlobalReset(); // Tenta avisar todos
            }

            // Voltas
            checkLaps(p);
        }

        // Reset Local Imediato (Para não ficar preso na grama)
        function triggerLocalCrash() {
            resetMyPosition();
            sfxCrash.play();
            body.classList.add('crash-flash');
            setTimeout(() => body.classList.remove('crash-flash'), 500);
        }

        async function triggerGlobalReset() {
            if (Date.now() - lastCrashTime < 2000) return;
            lastCrashTime = Date.now();
            
            // Avisa o banco
            const docRef = doc(db, 'corridas', 'sala_unica');
            try {
                await updateDoc(docRef, {
                    status: 'CRASHED',
                    lastCrash: Date.now(),
                    'p1.laps': 0,
                    'p2.laps': 0
                });
            } catch(e) {}
        }

        function checkLaps(player) {
            const cx = VIRTUAL_WIDTH/2;
            const cy = VIRTUAL_HEIGHT/2;
            // Linha de chegada no bottom (Y > cy + 200)
            if (player.y > cy + 200) { 
                 const wasLeft = (player.x - Math.cos(player.angle)*player.speed) < cx;
                 const isRight = player.x >= cx;
                 if (wasLeft && isRight) {
                     player.laps++;
                     sfxLap.currentTime = 0;
                     sfxLap.play(); 
                     updateMyScore();
                 }
            }
        }

        async function updateMyScore() {
            const el = document.getElementById(`p${myId}-laps`);
            el.innerText = state[`p${myId}`].laps;
            // Não checamos vitória aqui para não travar, apenas contamos infinito ou até 10 visualmente
        }

        // --- DESENHO SEGURO ---
        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            // Limpa
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            const offsetX = (canvas.width - VIRTUAL_WIDTH * scaleFactor) / 2;
            const offsetY = (canvas.height - VIRTUAL_HEIGHT * scaleFactor) / 2;
            ctx.translate(offsetX, offsetY);
            ctx.scale(scaleFactor, scaleFactor);

            const cx = VIRTUAL_WIDTH/2;
            const cy = VIRTUAL_HEIGHT/2;

            // Pista
            // 1. Perigo Externo
            ctx.beginPath();
            ctx.arc(cx, cy, SAFE_OUTER, 0, Math.PI*2);
            ctx.fillStyle = '#b91c1c'; // Vermelho
            ctx.fill();

            // 2. Borda
            ctx.beginPath();
            ctx.arc(cx, cy, TRACK_RADIUS + 50, 0, Math.PI*2);
            ctx.fillStyle = '#334155';
            ctx.fill();

            // 3. Asfalto
            ctx.beginPath();
            ctx.arc(cx, cy, TRACK_RADIUS + 45, 0, Math.PI*2);
            ctx.arc(cx, cy, TRACK_RADIUS - 45, 0, Math.PI*2, true);
            ctx.fillStyle = '#475569';
            ctx.fill();

            // 4. Perigo Interno
            ctx.beginPath();
            ctx.arc(cx, cy, SAFE_INNER, 0, Math.PI*2);
            ctx.fillStyle = '#b91c1c';
            ctx.fill();
            
            // 5. Centro Fundo
            ctx.beginPath();
            ctx.arc(cx, cy, SAFE_INNER - 15, 0, Math.PI*2);
            ctx.fillStyle = '#0f172a'; 
            ctx.fill();

            // Linha Chegada
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#fbbf24'; 
            ctx.beginPath();
            ctx.moveTo(cx, cy + TRACK_RADIUS - 50);
            ctx.lineTo(cx, cy + TRACK_RADIUS + 50);
            ctx.stroke();

            // Desenhar Carros
            drawCar(state.p1, '#ef4444'); 
            drawCar(state.p2, '#3b82f6'); 

            ctx.restore();
        }

        function drawCar(player, color) {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Sombra
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-12, -8, 24, 16);
            
            // Corpo
            ctx.fillStyle = color;
            drawRoundedRect(ctx, -10, -18, 20, 36, 4);

            // Luzes
            if (player.speed < 0.5) {
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-8, 18, 16, 2);
            }
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(6, -18, 4, 3);
            ctx.fillRect(-10, -18, 4, 3);

            ctx.restore();
            
            // Nome
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(player.name || '', player.x, player.y - 30);
        }

        function loop() {
            if (!isReady) return;
            try {
                updatePhysics();
                draw();
            } catch (e) { console.error(e); }
            requestAnimationFrame(loop);
        }

        // --- SYNC REDE ---
        async function sendData() {
            if (!isReady) return;
            const myPlayer = state[`p${myId}`];
            const docRef = doc(db, 'corridas', 'sala_unica');
            const payload = {};
            payload[`p${myId}`] = {
                x: Math.round(myPlayer.x),
                y: Math.round(myPlayer.y),
                angle: parseFloat(myPlayer.angle.toFixed(2)),
                laps: myPlayer.laps,
                name: myPlayer.name
            };
            try { await updateDoc(docRef, payload); } catch (e) {}
        }

        function setupListener() {
            onSnapshot(doc(db, 'corridas', 'sala_unica'), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                // CRASH (Reset Global)
                if (data.status === 'CRASHED' && data.lastCrash !== state.lastCrash) {
                    state.lastCrash = data.lastCrash;
                    
                    // Efeitos
                    sfxCrash.play();
                    body.classList.add('crash-flash');
                    setTimeout(() => body.classList.remove('crash-flash'), 500);
                    
                    // Reset Dados
                    state.p1.laps = 0;
                    state.p2.laps = 0;
                    resetMyPosition();
                    
                    const msg = document.getElementById('game-msg');
                    msg.innerText = "CRASH! RESET!";
                    msg.classList.replace('text-green-500', 'text-red-500');

                    setTimeout(() => {
                         msg.innerText = "JOGO ATIVO";
                         msg.classList.replace('text-red-500', 'text-green-500');
                    }, 2000);
                }

                // Sync Oponente
                const enemyId = myId === 1 ? 2 : 1;
                const enemyKey = `p${enemyId}`;
                const enemyData = data[enemyKey];
                
                if (enemyData) {
                    state[enemyKey].x = enemyData.x;
                    state[enemyKey].y = enemyData.y;
                    state[enemyKey].angle = enemyData.angle;
                    state[enemyKey].name = enemyData.name;
                    state[enemyKey].laps = enemyData.laps;
                    document.getElementById(`${enemyKey}-laps`).innerText = enemyData.laps;
                }
                
                // Garante que meu HUD mostra minhas voltas reais (caso resetado)
                document.getElementById(`p${myId}-laps`).innerText = state[`p${myId}`].laps;
            });
        }
    </script>
</body>
</html>
