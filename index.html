<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RACHA DOS IRMÃOS - V9 FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; touch-action: none; font-family: 'Verdana', sans-serif; user-select: none; }
        canvas { display: block; margin: auto; }
        
        /* Animações */
        .crash-flash { animation: flash-red 0.5s ease-in-out; }
        @keyframes flash-red { 0%, 100% { background-color: #0f172a; } 50% { background-color: #ef4444; } }

        /* Botões Iniciais */
        .btn-start { background: #ef4444; color: white; font-weight: 900; padding: 20px; border-radius: 15px; border: 3px solid #fff; width: 100%; margin-bottom: 15px; box-shadow: 0 5px 0 #991b1b; font-size: 1.2rem; cursor: pointer; position: relative; z-index: 50; }
        .btn-start:active { transform: translateY(4px); box-shadow: none; background: #dc2626; }
        
        .btn-join { background: #3b82f6; color: white; font-weight: 900; padding: 20px; border-radius: 15px; border: 3px solid #fff; width: 100%; box-shadow: 0 5px 0 #1e40af; font-size: 1.2rem; cursor: pointer; position: relative; z-index: 50; }
        .btn-join:active { transform: translateY(4px); box-shadow: none; background: #2563eb; }

        /* Botões de Jogo */
        .btn-game { 
            background: #334155; color: white; font-weight: bold; font-size: 12px;
            padding: 8px 12px; border-radius: 8px; border: 1px solid #94a3b8;
            pointer-events: auto; text-transform: uppercase; cursor: pointer;
        }

        /* Controles Mobile */
        .touch-area {
            position: absolute; bottom: 20px; width: 42%; height: 180px; 
            border-radius: 25px; border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(4px); cursor: pointer;
            user-select: none; -webkit-user-select: none;
        }
        .touch-area:active { background: rgba(255,255,255,0.3); border-color: #fff; }
        #btn-left { left: 15px; }
        #btn-right { right: 15px; }
        .arrow { font-size: 60px; color: rgba(255,255,255,0.6); pointer-events: none; }

        /* UI Overlay */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; z-index: 10; }
        .interactive { pointer-events: auto; }
        
        /* Debug info */
        .debug-text { font-size: 10px; color: #64748b; font-family: monospace; margin-top: 2px; background: rgba(0,0,0,0.5); padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body id="body">

    <!-- ÁUDIOS -->
    <audio id="bgm" loop>
        <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/KieLoKaz/Free_Ganxta_Phonk_Tracks/KieLoKaz_-_01_-_Ganxta_Phonk_Session_1.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-lap" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
    <audio id="sfx-crash" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

    <!-- LOBBY -->
    <div id="lobby" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center p-6 text-white interactive">
        <h1 class="text-5xl font-black italic mb-2 text-yellow-400 drop-shadow-lg">RACHA V9</h1>
        <p class="text-slate-400 mb-8 text-center text-sm">Versão Final com Suas Chaves</p>
        
        <div class="w-full max-w-sm flex flex-col gap-4">
            <input type="text" id="username" class="w-full bg-slate-800 border-2 border-slate-600 rounded-xl p-4 text-white font-bold uppercase text-center text-xl focus:border-yellow-400 outline-none" placeholder="SEU NOME">
            
            <button id="btn-p1" onclick="window.startGame(1)" class="btn-start">
                🏎️ SOU O P1 (VERMELHO)
            </button>
            <button id="btn-p2" onclick="window.startGame(2)" class="btn-join">
                🚙 SOU O P2 (AZUL)
            </button>
            
            <div id="loading-msg" class="hidden text-center text-yellow-400 font-bold animate-pulse">
                INICIANDO...
            </div>
            <p class="text-[10px] text-slate-500 text-center mt-4">Conectando ao jogo-de-2...</p>
        </div>
    </div>

    <!-- HUD -->
    <div id="game-ui" class="ui-layer hidden">
        <!-- Top Bar -->
        <div class="flex justify-between items-start w-full max-w-3xl mx-auto">
            
            <!-- P1 Stats -->
            <div class="flex flex-col items-center">
                <div class="bg-slate-900/90 border-l-4 border-red-500 p-2 rounded w-24 text-center shadow-lg">
                    <div class="text-[10px] text-red-400 font-bold">P1 (RED)</div>
                    <div id="p1-laps" class="text-3xl font-black text-white">0</div>
                </div>
            </div>

            <!-- Controls Center -->
            <div class="flex flex-col items-center gap-2 mt-2">
                <div id="game-status" class="text-yellow-400 font-bold text-xs bg-black/60 px-4 py-1 rounded-full border border-yellow-500/30">CONECTANDO...</div>
                <div class="flex gap-2">
                    <button onclick="toggleMusic()" class="btn-game interactive">🎵 TOCAR</button>
                    <button onclick="forceReset()" class="btn-game interactive">↺ RESET</button>
                </div>
            </div>

            <!-- P2 Stats -->
            <div class="flex flex-col items-center">
                <div class="bg-slate-900/90 border-r-4 border-blue-500 p-2 rounded w-24 text-center shadow-lg">
                    <div class="text-[10px] text-blue-400 font-bold">P2 (BLUE)</div>
                    <div id="p2-laps" class="text-3xl font-black text-white">0</div>
                </div>
            </div>
        </div>

        <!-- Touch Controls -->
        <div id="mobile-controls" class="w-full h-full pointer-events-none">
            <div id="btn-left" class="touch-area"><span class="arrow">◄</span></div>
            <div id="btn-right" class="touch-area"><span class="arrow">►</span></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- SUAS CHAVES DO FIREBASE (NÃO REMOVER!) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBfVOCuakSWtU6O_d_XstGoDpAg8fC2_n4",
            authDomain: "jogo-de-2-169d9.firebaseapp.com",
            projectId: "jogo-de-2-169d9",
            storageBucket: "jogo-de-2-169d9.firebasestorage.app",
            messagingSenderId: "37135467278",
            appId: "1:37135467278:web:e2e0cdec4c6dbcda768d5f"
        };

        // Inicialização
        let app, auth, db, dbConnected = false;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            console.log("Firebase Init OK");
        } catch (e) {
            console.error("Firebase Init Fail", e);
            alert("Erro nas Chaves do Firebase!");
        }

        // --- ÁUDIO ---
        const bgm = document.getElementById('bgm');
        const sfxLap = document.getElementById('sfx-lap');
        const sfxCrash = document.getElementById('sfx-crash');
        bgm.volume = 0.5;

        window.toggleMusic = () => {
            if (bgm.paused) {
                bgm.play().then(() => console.log("Tocando")).catch(e => alert("Toque na tela antes!"));
            } else {
                bgm.pause();
            }
        };

        // --- VARIÁVEIS DO JOGO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const body = document.getElementById('body');
        
        // Dimensões
        const VIRTUAL_WIDTH = 800;
        const VIRTUAL_HEIGHT = 800;
        const TRACK_RADIUS = 320;
        const TRACK_WIDTH = 120;
        const SAFE_INNER = TRACK_RADIUS - (TRACK_WIDTH/2) - 10;
        const SAFE_OUTER = TRACK_RADIUS + (TRACK_WIDTH/2) + 10;
        
        let myId = 0; 
        let isReady = false;
        let scaleFactor = 1;
        let lastCrashTime = 0;
        let currentUser = null;

        // Física
        const MAX_SPEED = 8.0;
        const ACCEL = 0.35;
        const TURN_SPEED = 0.09;
        const FRICTION = 0.96;

        const state = {
            p1: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, name: 'P1' },
            p2: { x: 0, y: 0, angle: 0, speed: 0, laps: 0, name: 'P2' },
            status: 'RACING',
            lastCrash: 0
        };

        const keys = { left: false, right: false, up: false };

        // --- AUTENTICAÇÃO ANÔNIMA ---
        if (auth) {
            signInAnonymously(auth).catch((error) => {
                console.error("Erro no login anônimo:", error);
                updateStatus("ERRO LOGIN", "red");
            });

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("Logado como:", user.uid);
                    currentUser = user;
                    dbConnected = true;
                    updateStatus("ONLINE", "green");
                } else {
                    updateStatus("DESCONECTADO", "red");
                }
            });
        }

        function updateStatus(text, color) {
            const el = document.getElementById('game-status');
            if(el) {
                el.innerText = text;
                el.className = `text-${color}-400 font-bold text-xs bg-black/60 px-4 py-1 rounded-full border border-${color}-500/30`;
            }
        }

        // --- RESIZE ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const scaleX = window.innerWidth / VIRTUAL_WIDTH;
            const scaleY = window.innerHeight / VIRTUAL_HEIGHT;
            scaleFactor = Math.min(scaleX, scaleY) * 0.95;
        }
        window.addEventListener('resize', resize);
        
        // --- INICIAR JOGO ---
        window.startGame = (id) => {
            console.log("Start Game ID:", id);
            const nameInput = document.getElementById('username').value.trim() || `P${id}`;
            myId = id;
            
            // UI
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('mobile-controls').style.display = 'block';

            resize();
            resetMyPosition();
            state[`p${myId}`].name = nameInput;

            isReady = true;
            requestAnimationFrame(loop);
            
            // Sync Loop
            setInterval(sendData, 40); 
            setupListener();

            // Música
            bgm.play().catch(e => console.log("Musica precisa de clique"));
        };

        // --- BANCO DE DADOS ---
        // Usando o caminho da collection direta pois suas regras permitem
        // Caso mude a regra para auth!=null, isso continua funcionando
        const getGameDoc = () => doc(db, 'corridas', 'sala_unica_v9');

        // --- RESET ---
        window.forceReset = async () => {
            if(!isReady) return;
            state.p1.laps = 0; state.p2.laps = 0;
            resetMyPosition();
            
            if (dbConnected) {
                try {
                    await setDoc(getGameDoc(), {
                        status: 'CRASHED',
                        lastCrash: Date.now(),
                        p1: { laps: 0 },
                        p2: { laps: 0 }
                    }, { merge: true });
                } catch(e) {}
            }
        };

        function resetMyPosition() {
            const startY = VIRTUAL_HEIGHT/2 + TRACK_RADIUS - 40;
            const p = state[`p${myId}`];
            p.x = (myId === 1) ? VIRTUAL_WIDTH/2 - 40 : VIRTUAL_WIDTH/2 + 40;
            p.y = startY;
            p.angle = 0; 
            p.speed = 0;
        }

        // --- CONTROLES ---
        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft') keys.left = true;
            if(e.key === 'ArrowRight') keys.right = true;
            if(e.key === 'ArrowUp') keys.up = true;
        });
        window.addEventListener('keyup', e => {
            if(e.key === 'ArrowLeft') keys.left = false;
            if(e.key === 'ArrowRight') keys.right = false;
            if(e.key === 'ArrowUp') keys.up = false;
        });

        const handleInput = (dir, active) => {
            if(dir === 'left') keys.left = active;
            if(dir === 'right') keys.right = active;
            keys.up = (keys.left || keys.right); 
        };

        const bl = document.getElementById('btn-left');
        const br = document.getElementById('btn-right');
        
        bl.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput('left', true); });
        bl.addEventListener('touchend', (e) => { e.preventDefault(); handleInput('left', false); });
        br.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput('right', true); });
        br.addEventListener('touchend', (e) => { e.preventDefault(); handleInput('right', false); });
        
        bl.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput('left', true); });
        bl.addEventListener('mouseup', (e) => { e.preventDefault(); handleInput('left', false); });
        br.addEventListener('mousedown', (e) => { e.preventDefault(); handleInput('right', true); });
        br.addEventListener('mouseup', (e) => { e.preventDefault(); handleInput('right', false); });
        bl.addEventListener('mouseleave', () => handleInput('left', false));
        br.addEventListener('mouseleave', () => handleInput('right', false));

        // --- LÓGICA ---
        function updatePhysics() {
            const p = state[`p${myId}`];
            
            if (keys.up) p.speed += ACCEL;
            p.speed *= FRICTION;
            if (p.speed > MAX_SPEED) p.speed = MAX_SPEED;
            
            if (Math.abs(p.speed) > 0.1) {
                if (keys.left) p.angle -= TURN_SPEED;
                if (keys.right) p.angle += TURN_SPEED;
            }

            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed;

            const dx = p.x - VIRTUAL_WIDTH/2;
            const dy = p.y - VIRTUAL_HEIGHT/2;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < SAFE_INNER || dist > SAFE_OUTER) {
                handleSelfCrash();
            }
            checkLaps(p);
        }

        function handleSelfCrash() {
            resetMyPosition();
            sfxCrash.play().catch(()=>{});
            body.classList.add('crash-flash');
            setTimeout(() => body.classList.remove('crash-flash'), 500);
            
            if (Date.now() - lastCrashTime > 2000) {
                forceReset();
            }
        }

        function checkLaps(player) {
            const cx = VIRTUAL_WIDTH/2;
            const cy = VIRTUAL_HEIGHT/2;
            if (player.y > cy + 200) { 
                 const wasLeft = (player.x - Math.cos(player.angle)*player.speed) < cx;
                 const isRight = player.x >= cx;
                 if (wasLeft && isRight) {
                     player.laps++;
                     sfxLap.currentTime = 0;
                     sfxLap.play().catch(()=>{});
                     updateMyScore();
                 }
            }
        }

        async function updateMyScore() {
            document.getElementById(`p${myId}-laps`).innerText = state[`p${myId}`].laps;
        }

        // --- DESENHO ---
        function drawRoundedRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            const offsetX = (canvas.width - VIRTUAL_WIDTH * scaleFactor) / 2;
            const offsetY = (canvas.height - VIRTUAL_HEIGHT * scaleFactor) / 2;
            ctx.translate(offsetX, offsetY);
            ctx.scale(scaleFactor, scaleFactor);

            const cx = VIRTUAL_WIDTH/2;
            const cy = VIRTUAL_HEIGHT/2;

            // Pista
            ctx.beginPath(); ctx.arc(cx, cy, SAFE_OUTER, 0, Math.PI*2); ctx.fillStyle = '#ef4444'; ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, TRACK_RADIUS + 60, 0, Math.PI*2); ctx.fillStyle = '#334155'; ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, TRACK_RADIUS + 50, 0, Math.PI*2); ctx.fillStyle = '#475569'; ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, TRACK_RADIUS - 50, 0, Math.PI*2); ctx.fillStyle = '#334155'; ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, SAFE_INNER, 0, Math.PI*2); ctx.fillStyle = '#ef4444'; ctx.fill();
            ctx.beginPath(); ctx.arc(cx, cy, SAFE_INNER - 10, 0, Math.PI*2); ctx.fillStyle = '#0f172a'; ctx.fill();

            ctx.lineWidth = 12; ctx.strokeStyle = '#fbbf24'; 
            ctx.beginPath(); ctx.moveTo(cx, cy + TRACK_RADIUS - 50); ctx.lineTo(cx, cy + TRACK_RADIUS + 50); ctx.stroke();

            drawCar(state.p1, '#ef4444'); 
            drawCar(state.p2, '#3b82f6'); 

            ctx.restore();
        }

        function drawCar(player, color) {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(-14, -10, 28, 20);
            
            ctx.fillStyle = color;
            drawRoundedRect(ctx, -12, -22, 24, 44, 6);

            if (player.speed < 0.5) { ctx.fillStyle = '#ff0000'; ctx.fillRect(-10, 20, 20, 3); }
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(8, -22, 5, 4); ctx.fillRect(-13, -22, 5, 4);
            ctx.fillStyle = '#000'; ctx.fillRect(-10, -8, 20, 12);

            ctx.restore();
            
            ctx.fillStyle = 'white'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
            ctx.fillText(player.name || '', player.x, player.y - 35);
        }

        function loop() {
            if (!isReady) return;
            try { updatePhysics(); draw(); } catch (e) {}
            requestAnimationFrame(loop);
        }

        // --- NETWORKING ---
        async function sendData() {
            if (!isReady || !currentUser || !dbConnected) return;
            
            const myData = {
                x: Math.round(state[`p${myId}`].x),
                y: Math.round(state[`p${myId}`].y),
                angle: parseFloat(state[`p${myId}`].angle.toFixed(2)),
                laps: state[`p${myId}`].laps,
                name: state[`p${myId}`].name
            };

            const payload = {};
            payload[`p${myId}`] = myData;

            try {
                await setDoc(getGameDoc(), payload, { merge: true });
            } catch(e) { console.error("Erro envio:", e); }
        }

        function setupListener() {
            if (!dbConnected) return;

            onSnapshot(getGameDoc(), (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                
                if (data.status === 'CRASHED' && data.lastCrash !== state.lastCrash) {
                    state.lastCrash = data.lastCrash;
                    sfxCrash.play().catch(()=>{});
                    body.classList.add('crash-flash');
                    setTimeout(() => body.classList.remove('crash-flash'), 500);
                    state.p1.laps = 0; 
                    state.p2.laps = 0;
                    if(data.p1) data.p1.laps = 0;
                    if(data.p2) data.p2.laps = 0;
                    resetMyPosition();
                }

                // Sync Oponente
                const enemyId = myId === 1 ? 2 : 1;
                const enemyKey = `p${enemyId}`;
                const enemyData = data[enemyKey];
                
                if (enemyData) {
                    state[enemyKey].x = enemyData.x;
                    state[enemyKey].y = enemyData.y;
                    state[enemyKey].angle = enemyData.angle;
                    state[enemyKey].name = enemyData.name;
                    state[enemyKey].laps = enemyData.laps;
                }
                
                if(data[`p${myId}`]) {
                     if(data[`p${myId}`].laps === 0 && state[`p${myId}`].laps !== 0) {
                         state[`p${myId}`].laps = 0;
                     }
                }
                document.getElementById(`p1-laps`).innerText = state.p1.laps;
                document.getElementById(`p2-laps`).innerText = state.p2.laps;
            });
        }
    </script>
</body>
</html>
